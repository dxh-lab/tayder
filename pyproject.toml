[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tayder"
version = "0.1.0"
description = "Hands-off crypto SPOT helper: Discord Approve/Skip → Coinbase Advanced Trade"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "dxh-lab" }]
dependencies = [
    "httpx>=0.27",
    "discord.py>=2.4",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "PyJWT>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
tayder = "tayder.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tayder"]

[tool.hatch.build.targets.wheel.sources]
"src/tayder" = "tayder"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
